[package]
name = "youtubeapi"
version = "0.1.0"
edition = "2021"
description = "API lokal YouTube (info, search, stream, download) - pure Rust std, tanpa dependency"

[[bin]]
name = "youtubeapi"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
